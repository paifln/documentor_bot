name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: documentor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d documentor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/documentor_test
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: mock
      BOT_TOKEN: '123456:TEST_TOKEN_DO_NOT_USE'
      PYTHONDONTWRITEBYTECODE: '1'
      RUN_SERVICE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: alembic upgrade head
      - run: pytest -q
      - run: docker build -t documentor:test .
