# RulePreset — Makhambet University, Дипломная работа
id: makhambet_diploma
name: "Makhambet University — Дипломная работа"
institution: "Makhambet University"
work_type: diploma
description: >
  Требования к оформлению дипломной (выпускной квалификационной)
  работы Makhambet University. Формально совпадают с курсовой по
  оформлению, но структура и список литературы строже.

page:
  size: A4
  orientation: portrait

margins:
  top_mm: 20
  bottom_mm: 20
  left_mm: 30
  right_mm: 10
  tolerance_mm: 1.5

font:
  name: "Times New Roman"
  size_pt: 14
  tolerance_pt: 0.5
  allow_headings_bold: true
  max_foreign_font_share_pct: 5.0

paragraph:
  alignment: justify
  first_line_indent_cm: 1.25
  indent_tolerance_cm: 0.15
  line_spacing: 1.5
  line_spacing_tolerance: 0.1
  max_left_indent_cm: 0.5
  max_right_indent_cm: 0.5

headings:
  require_numbering: true
  max_level: 4
  require_page_break_before_top_level: true

structure:
  required_sections:
    - introduction
    - theoretical_part
    - practical_part
    - conclusion
    - references
  optional_sections:
    - appendix
  min_words_introduction: 400
  min_words_conclusion: 300

references:
  min_sources: 30
  require_in_text_citations: true
  max_allowed_duplicate_sources: 0

scoring:
  formatting: 25
  structure: 20
  language: 15
  style: 10
  content: 30

is_active: true
