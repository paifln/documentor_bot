# RulePreset — Makhambet University, Курсовая работа
#
# This is the DEFAULT preset for this deployment (see DEFAULT_RULE_PRESET
# in .env). Values below follow common Kazakhstani university formatting
# standards (GOST-style: TNR 14pt, 1.5 spacing, 30/10/20/20 mm margins).
# Adjust freely — this file is the single source of truth, no code change
# needed after editing it (restart the app or call PresetRegistry.reload()).

id: makhambet_coursework
name: "Makhambet University — Курсовая работа"
institution: "Makhambet University"
work_type: coursework
description: >
  Стандартные требования к оформлению курсовой работы
  Makhambet University.

page:
  size: A4
  orientation: portrait

margins:
  top_mm: 20
  bottom_mm: 20
  left_mm: 30
  right_mm: 10
  tolerance_mm: 1.5

font:
  name: "Times New Roman"
  size_pt: 14
  tolerance_pt: 0.5
  allow_headings_bold: true
  max_foreign_font_share_pct: 5.0

paragraph:
  alignment: justify
  first_line_indent_cm: 1.25
  indent_tolerance_cm: 0.15
  line_spacing: 1.5
  line_spacing_tolerance: 0.1
  max_left_indent_cm: 0.5
  max_right_indent_cm: 0.5

headings:
  require_numbering: true
  max_level: 3
  require_page_break_before_top_level: false

structure:
  required_sections:
    - introduction
    - theoretical_part
    - practical_part
    - conclusion
    - references
  optional_sections:
    - appendix
  min_words_introduction: 250
  min_words_conclusion: 200

references:
  min_sources: 15
  require_in_text_citations: true
  max_allowed_duplicate_sources: 0

scoring:
  formatting: 30
  structure: 20
  language: 15
  style: 10
  content: 25

is_active: true
