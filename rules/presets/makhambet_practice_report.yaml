# RulePreset — Makhambet University, Отчёт по практике
#
# Требования к оформлению совпадают с курсовой работой (стандарт ГОСТ:
# TNR 14pt, полуторный интервал, поля 30/10/20/20 мм), но структура и
# список литературы менее строгие — отчёт по практике короче и не
# предполагает деления на теоретическую/практическую главы.

id: makhambet_practice_report
name: "Makhambet University — Отчёт по практике"
institution: "Makhambet University"
work_type: report
description: >
  Требования к оформлению отчёта по учебной/производственной/
  преддипломной практике Makhambet University.

page:
  size: A4
  orientation: portrait

margins:
  top_mm: 20
  bottom_mm: 20
  left_mm: 30
  right_mm: 10
  tolerance_mm: 1.5

font:
  name: "Times New Roman"
  size_pt: 14
  tolerance_pt: 0.5
  allow_headings_bold: true
  max_foreign_font_share_pct: 5.0

paragraph:
  alignment: justify
  first_line_indent_cm: 1.25
  indent_tolerance_cm: 0.15
  line_spacing: 1.5
  line_spacing_tolerance: 0.1
  max_left_indent_cm: 0.5
  max_right_indent_cm: 0.5

headings:
  require_numbering: true
  max_level: 3
  require_page_break_before_top_level: false

structure:
  required_sections:
    - introduction
    - main_body
    - conclusion
    - references
  optional_sections:
    - appendix
  min_words_introduction: 150
  min_words_conclusion: 100

references:
  min_sources: 8
  require_in_text_citations: false
  max_allowed_duplicate_sources: 0

scoring:
  formatting: 25
  structure: 25
  language: 15
  style: 10
  content: 25

is_active: true

# No current department-specific formatting guide has been verified.
provenance:
  status: unverified
  scope: "Предварительный профиль ЗКУ им. М. Утемисова; требуется методичка кафедры."
  sources:
    - "https://wku.edu.kz/images/2025/akadem-ru25.pdf"
  reviewed_on: "2026-09-26"
advisory_rules:
  - structure.section.theoretical_part
  - structure.section.practical_part
  - structure.min_words.introduction
  - structure.min_words.conclusion
  - references.min_count
scoring_policy:
  version: "2"
  critical: 0.35
  error: 0.15
  warning: 0.05
